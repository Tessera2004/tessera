<!doctype html><html lang="de"><meta charset="utf-8"><title>MosaOS · Momentum</title><meta name="robots" content="noindex,nofollow"><style>html,body{margin:0;overflow:hidden;background:#05070c}canvas{display:block;width:100vw;height:100vh}</style><canvas id="c" width="1920" height="1080"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),W=1920,H=1080,R='#E11D2A',WHT='#F7F7F8',M='#93A4BA',B='#0A101B';
const C=x=>Math.max(0,Math.min(1,x)),E=x=>{x=C(x);return 1-(1-x)**3},S=x=>{x=C(x);return x*x*(3-2*x)},L=(a,b,p)=>a+(b-a)*p;
function rr(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
function tx(s,x,y,z=24,col=WHT,w=700,align='left'){g.fillStyle=col;g.font=`${w} ${z}px Arial`;g.textAlign=align;g.fillText(s,x,y);g.textAlign='left'}
function ln(x,y,X,Y,col='#31445e',w=2){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function lay(x,y,s,a,r,fn){g.save();g.globalAlpha*=C(a);g.translate(x,y);g.rotate(r);g.scale(s,s);fn();g.restore()}
function brand(x,y,s=1){lay(x,y,s,1,0,()=>{for(let i=0;i<4;i++)rr(i%2*19,Math.floor(i/2)*19,14,14,3,i===3?R:WHT);tx('Mosa',52,30,37,WHT,800);tx('OS',148,30,37,R,800)})}
function glass(x,y,w,h,a=1){g.save();g.globalAlpha*=a;rr(x,y,w,h,22,'#121C2BD9','#40546E');g.restore()}
function doc(kind,x,y,s,r,a){lay(x,y,s,a,r,()=>{rr(-245,-170,490,340,20,'#EDF2F7','#fff');rr(-245,-170,490,48,20,kind==='xls'?'#16704D':'#2860BD');tx(kind==='xls'?'Einsatzplan.xlsx':'Offerte.docx',-217,-138,19,WHT,800);if(kind==='xls'){for(let i=0;i<6;i++)for(let j=0;j<4;j++){rr(-220+j*110,-101+i*38,109,37,0,i?'#fff':'#D4E8DD','#C4D0D8');if(i<4)tx(i?['Praxis','Team Nord','07:30','offen'][j]:['Objekt','Team','Zeit','Status'][j],-211+j*110,-76+i*38,13,'#26394B',500)}}else{tx('OFFERTE',-200,-60,34,'#1B2D45',800);for(let i=0;i<7;i++)rr(-200,-25+i*27,i===6?190:390,7,4,'#BFCAD7')}})}
function mail(x,y,s,r,a){lay(x,y,s,a,r,()=>{glass(-220,-130,440,260);tx('NEUE NACHRICHT',-187,-83,14,'#77C8FF',800);tx('Wer übernimmt morgen?',-187,-27,27,WHT,800);tx('Der Einsatz wurde verschoben.',-187,13,18,M,500);rr(-187,62,240,43,10,'#2B3B50');tx('Antwort ausstehend',-168,91,16,'#FFC27D',700)})}
function card(x,y,w,title,sub,col=R,a=1){g.save();g.globalAlpha*=a;rr(x,y,w,88,14,'#202D40','#49607D');rr(x,y,6,88,3,col);tx(title,x+25,y+35,24,WHT,800);tx(sub,x+25,y+65,16,M,500);g.restore()}
function streak(t){for(let i=0;i<70;i++){let x=(i*263+t*(80+i%5*22))%(W+500)-250,y=(i*157)%H,len=10+(i%6)*14;g.globalAlpha=.08+(i%5)*.035;ln(x,y,x+len,y,i%9===0?R:'#8FCBFF',1+(i%3))}g.globalAlpha=1}
function grid(t){g.save();g.translate(W/2,H*.62);g.rotate(-.05);for(let i=-12;i<=12;i++){let x=i*110+(t*55)%110;ln(x,-500,x*2,500,'#27405D55')}for(let i=0;i<14;i++){let y=((i*85+t*70)%850)-300;ln(-1100,y,1100,y,'#27405D55')}g.restore()}
function transition(t,at){let p=1-Math.abs(t-at)/.18;if(p>0){g.save();g.globalAlpha=C(p);g.translate(W/2,H/2);g.rotate(-.2);g.fillStyle=WHT;g.fillRect(-1500,-45,3000,90);g.fillStyle=R;g.fillRect(-1500,50,3000,16);g.restore()}}
function scene1(t){let a=C((t-0)/.25)*C((2.65-t)/.35),u=E(t/2.6),spin=Math.sin(t*2)*.035;doc('xls',L(-300,570,E(t/.8)),L(760,420,E(t/.8)),1.25,spin,a);doc('doc',L(2200,1370,E(t/.9)),L(120,400,E(t/.9)),1.15,-spin,a);mail(L(950,990,E(t/.65)),L(1300,735,E(t/.65)),1.05,.02,a);lay(960,L(-100,160,E(t/.65)),1,a,0,()=>tx('ZU VIELE EINZELTEILE.',0,0,68,WHT,900,'center'));let p=S((t-1.8)/.75);if(p){lay(960,520,L(.1,1.15,p),p*a,0,()=>{g.beginPath();g.arc(0,0,125,0,7);g.strokeStyle=R;g.lineWidth=4;g.stroke();brand(-112,-20,1.05)})}}
function scene2(t){let u=t-2.35,a=C(u/.25)*C((5.15-t)/.3),z=L(.4,1.22,E(u/1.8));lay(L(1050,820,S(u/2)),520,z,a,-.035*Math.sin(u*1.4),()=>{glass(-650,-340,1300,680);brand(-605,-300,.62);tx('Dashboard',-370,-275,25,WHT,800);ln(-650,-240,650,-240);for(let i=0;i<4;i++){let q=E((u-.35-i*.11)/.35);lay(0,L(70,0,q),1,q,0,()=>{glass(-600+i*300,-170,270,130);tx(['3','3','11','1'][i],-565+i*300,-95,45,WHT,800);tx(['EINSÄTZE','TEAM','KUNDEN','AUFGABEN'][i],-565+i*300,-130,13,M,700)})}let q=E((u-1)/.45);lay(0,L(100,0,q),1,q,0,()=>{glass(-600,10,1165,235);tx('Heute im Fokus',-560,55,17,R,800);tx('Einsatzplanung',-560,101,34,WHT,800);card(-560,135,1060,'Praxis am Bahnhof','07:30–09:30 · Team Nord')})});lay(95,930,1,a,0,()=>{tx('01',0,-52,16,R,900);tx('EIN BLICK. ALLES DA.',0,0,53,WHT,900)})}
function scene3(t){let u=t-4.85,a=C(u/.25)*C((8.05-t)/.3);lay(L(890,690,S(u/2.8)),500,L(.74,1.08,E(u/2)),a,.025*Math.sin(u*2),()=>{glass(-650,-350,1300,700);brand(-610,-307,.55);tx('Einsatzplanung',-385,-285,24,WHT,800);for(let i=0;i<4;i++){tx(['07:00','09:00','11:00','13:00'][i],-605,-190+i*135,18,M,600);ln(-500,-197+i*135,610,-197+i*135)}let p=E((u-.3)/.75);card(L(720,-480,p),L(-280,-205,p),1020,'Praxis am Bahnhof','07:30–09:30 · Team Nord',R,p);let p2=E((u-1)/.45);card(-480,-70,820,'Müller Treuhand','10:15–11:45 · Team Stadt','#59B9FF',p2);let p3=E((u-1.35)/.45);card(-480,65,920,'Wohnung Russo','13:00–17:00 · Team Nord',R,p3)});let fly=E((u-2.25)/.65);if(fly>0&&a>0)card(L(1100,1530,fly),L(320,485,fly),310,'Praxis','Team Nord',R,a*(1-fly*.4));lay(90,935,1,a,0,()=>{tx('02',0,-52,16,R,900);tx('ZIEHEN. PLANEN. FERTIG.',0,0,53,WHT,900)})}
function scene4(t){let u=t-7.75,a=C(u/.2)*C((10.8-t)/.28),phoneX=L(2150,1370,E(u/.55));for(let i=0;i<4;i++){g.globalAlpha=a*.35;g.beginPath();g.ellipse(980,520,300+i*95,90+i*35,t*.15+i*.25,0,7);g.strokeStyle=i%2?R:'#4F94C9';g.lineWidth=2;g.stroke()}g.globalAlpha=1;lay(phoneX,515,1,a,.035*Math.sin(u*2.3),()=>{rr(-185,-375,370,750,54,'#35445A','#8DA1BA');rr(-174,-364,348,728,44,'#0E1827');rr(-54,-341,108,24,15,'#05080D');tx('MEIN EINSATZ',-140,-274,15,'#62C2FF',800);tx('Praxis am Bahnhof',-140,-225,29,WHT,800);tx('07:30–09:30 · Team Nord',-140,-183,17,M,500);card(-140,-125,280,'Vor Ort','Nachweis erfassen');let p=E((u-1.2)/.45),pulse=Math.sin(C((u-1.3)/.5)*Math.PI);rr(-140,30,280,62,13,p>.55?'#16503B':R);tx(p>.55?'Nachweis gespeichert':'Einsatz abschliessen',0,70,19,WHT,800,'center');if(p>0){g.globalAlpha*=p;g.beginPath();g.arc(0,182,45+pulse*22,0,7);g.strokeStyle='#5CE6AA';g.lineWidth=4;g.stroke();tx('✓',0,195,40,'#5CE6AA',800,'center')}});g.save();g.globalAlpha=a;for(let i=0;i<13;i++){let p=((u*.8+i/13)%1+1)%1;let x=L(420,phoneX-190,p),y=510+Math.sin(p*Math.PI*2)*115;rr(x-4,y-4,8,8,4,i%3?R:'#68C8FF')}g.restore();lay(90,935,1,a,0,()=>{tx('03',0,-52,16,R,900);tx('VOR ORT. SOFORT VERBUNDEN.',0,0,53,WHT,900)})}
function scene5(t){let u=t-10.5,a=C(u/.2)*C((13.1-t)/.3);for(let i=0;i<18;i++){let p=E((u-i*.025)/.55),ang=i*.77+t*.5,r=520*(1-p);lay(1080+Math.cos(ang)*r,520+Math.sin(ang)*r*.5,L(.15,1,p),a*p,ang,()=>rr(-25,-25,50,50,8,i%4===0?R:'#DDE7F2'))}lay(L(1250,1110,E(u/.7)),510,L(.6,1.05,E(u/.8)),a,-.025*Math.sin(u*2),()=>{rr(-300,-390,600,780,18,'#F2F5F8','#fff');tx('RECHNUNG',-245,-305,43,'#17273B',900);tx('Praxis am Bahnhof',-245,-247,25,'#17273B',700);for(let i=0;i<5;i++){let q=E((u-.45-i*.12)/.35);lay(0,L(55,0,q),1,q,0,()=>{ln(-245,-145+i*82,245,-145+i*82,'#BBC9D8');tx(['Reinigung','Leistungsnachweis','Erfasste Zeit','Entwurf prüfen','PDF erstellen'][i],-245,-105+i*82,20,i===4?R:'#405773',i===4?800:500)})}});lay(105,470,1,a,0,()=>{tx('04',0,-80,16,R,900);tx('DATEN REIN.',0,-15,58,WHT,900);tx('DOKUMENT RAUS.',0,52,58,WHT,900);tx('Prüfen und weiterarbeiten.',0,112,22,M,500)})}
function scene6(t){let u=t-12.75,a=C(u/.2);for(let k=0;k<4;k++){g.globalAlpha=a*.34;g.beginPath();g.ellipse(960,505,240+k*105,70+k*38,t*(.7-k*.08),0,7);g.strokeStyle=k===0?R:'#47749C';g.lineWidth=2;g.stroke();for(let i=0;i<8;i++){let q=t*(.7-k*.08)+i*.785;rr(956+Math.cos(q)*(240+k*105),501+Math.sin(q)*(70+k*38),8,8,4,i%3?R:'#7DD4FF')}}g.globalAlpha=1;lay(960,485,1,a,0,()=>rr(-525,-195,1050,390,34,'#09121ED9','#304763'));let pulse=1+Math.sin(u*4)*.015;lay(960,450,pulse,a,0,()=>{brand(-170,-95,1.65);tx('DEIN BETRIEB IN BEWEGUNG.',0,65,55,WHT,900,'center');tx('mosaos.ch',0,140,28,R,800,'center')});let scan=((u*.7)%1);g.globalAlpha=a*.7;ln(660,665,660+scan*600,665,R,4);rr(655+scan*600,659,12,12,6,WHT);g.globalAlpha=1}
window.renderFrame=t=>{g.fillStyle=B;g.fillRect(0,0,W,H);let bg=g.createRadialGradient(1000,500,20,1000,500,1000);bg.addColorStop(0,'#162943');bg.addColorStop(1,B);g.fillStyle=bg;g.fillRect(0,0,W,H);grid(t);streak(t);scene1(t);scene2(t);scene3(t);scene4(t);scene5(t);scene6(t);[2.5,5,7.9,10.65,12.9].forEach(x=>transition(t,x));tx('BEISPIELDATEN',1740,1035,12,'#70839B',700);};
if(location.search.includes('render'))renderFrame(0);else{let s=performance.now();function loop(){renderFrame(((performance.now()-s)/1000)%15.2);requestAnimationFrame(loop)}loop()}
</script></html>
