// Deterministic frame clock: preview and export share exactly the same geometry.
const c=document.querySelector('canvas'),g=c.getContext('2d');const W=1920,H=1080,R='#E11D2A',white='#f5f5f7',muted='#9aabc1';

function brand(x,y,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);for(let i=0;i<4;i++)box(i%2*18,Math.floor(i/2)*18,13,13,3,i===3?R:white,null);text('Mosa',48,28,34,white,800);text('OS',133,28,34,R,800);g.restore()}
function layer(x,y,s,a,rot,fn){g.save();g.globalAlpha*=clamp(a);g.translate(x,y);g.rotate(rot);g.scale(s,s);fn();g.restore()}
function doc(type,x,y,s,rot,a){layer(x,y,s,a,rot,()=>{box(-230,-170,460,340,18,'#ecf0f5','#ffffff');box(-230,-170,460,45,18,type==='sheet'?'#166a49':'#2256b5',null);text(type==='sheet'?'Einsatzplan_final_v7.xlsx':'Offerte_neu.docx',-207,-141,17,white,700);if(type==='sheet'){for(let i=0;i<7;i++){for(let j=0;j<4;j++){box(-210+j*106,-108+i*34,105,33,0,i===0?'#d3e7dc':'#fff','#c5d1d6');if(i<5)text(i===0?['Objekt','Team','Zeit','Status'][j]:[['Praxis','Nord','07:30','offen'],['Büro','Stadt','10:15','?'],['Wohnung','Nord','13:00','offen']][(i-1)%3][j],-203+j*106,-86+i*34,12,'#273b46')}}}else{text('OFF ERTE'.replace(' ',''),-190,-78,30,'#172b46',800);for(let i=0;i<6;i++)box(-190,-44+i*25,i===5?160:350,7,3,'#c3ccd7',null);text('Version 3 · noch nicht versendet',-190,135,14,'#68788c')}})}

function panel(){box(-650,-330,1300,660,24,'#111925','#46536b');brand(-610,-298,.65);text('Einsatzplanung',-380,-278,23,white,700);text('Mittwoch, 9. September',285,-278,17,muted);line(-650,-250,650,-250,'#324154');for(let i=0;i<4;i++){text(['07:00','09:00','11:00','13:00'][i],-604,-176+i*125,18,muted);line(-515,-185+i*125,608,-185+i*125,'#26364b')} }

window.renderFrame=function(t){g.globalAlpha=1;g.fillStyle='#080c14';g.fillRect(0,0,W,H);let bg=g.createRadialGradient(1000,480,30,1000,480,1050);bg.addColorStop(0,'#182941');bg.addColorStop(1,'#070a10');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let i=0;i<65;i++){let x=(i*313.7+t*(i%2?13:-9)+4000)%W,y=(i*171.3)%H;g.globalAlpha=.1+(i%4)*.05;box(x,y,2,2,1,'#afcaff',null)}g.globalAlpha=1;

// 14–24: a luminous route carries the same job into a mobile device.
if(t>=14&&t<24.8){let e=ease((t-14)/1.3),out=ease((t-23.4)/1.4);orbit(t,.45*e*(1-out));let fx=mix(250,470,e),fy=460;layer(fx,fy,.8,e*(1-out),-.035,()=>{box(-310,-200,620,400,25,'#121b28');text('PRAXIS AM BAHNHOF',-270,-140,17,'#80abc9',700);text('Ein Einsatz.',-270,-70,48,white,800);text('Alle verbunden.',-270,-15,48,white,800);text('Team · Zeit · Nachweis',-270,65,22,muted);});let p=ease((t-15.2)/2);let X=1400,Y=480;g.globalAlpha=e*(1-out);g.beginPath();g.moveTo(720,460);g.bezierCurveTo(920,220,1090,710,X-180,Y);g.strokeStyle='#415c7d';g.lineWidth=2;g.stroke();for(let i=0;i<9;i++){let u=((t-14)*.35+i/9)%1;if(u<0)continue;let x=(1-u)**3*720+3*(1-u)**2*u*920+3*(1-u)*u*u*1090+u**3*(X-180),y=(1-u)**3*460+3*(1-u)**2*u*220+3*(1-u)*u*u*710+u**3*Y;box(x-4,y-4,8,8,4,R,null)}g.globalAlpha=1;layer(X,mix(1200,Y,e),1,e*(1-out),.04*(1-e),()=>{box(-180,-360,360,720,48,'#39465b','#8091a8');box(-170,-350,340,700,42,'#111a28',null);box(-51,-330,102,23,14,'#05080d',null);text('MEIN EINSATZ',-141,-267,14,'#6eb8ed',700);text('Praxis am Bahnhof',-141,-222,27,white,700);text('07:30–09:30 · Team Nord',-141,-186,16,muted);card(-143,-145,286,'Vor Ort','Nachweis erfassen');let done=ease((t-19)/.6);box(-140,1,280,58,12,done>.5?'#174d3b':R,null);text(done>.5?'Nachweis gespeichert':'Einsatz abschliessen',-120,36,19,white,700);if(done>0){g.globalAlpha*=done;g.beginPath();g.arc(0,170,48,0,7);g.strokeStyle='#61e3a9';g.lineWidth=3;g.stroke();line(-22,168,-4,187,'#61e3a9',5);line(-4,187,27,149,'#61e3a9',5)}});layer(90,945,1,e*(1-out),0,()=>{text('02 / ZUSAMMENARBEITEN',0,-55,15,'#7da9cc',700);text('Der Fortschritt kommt mit.',0,0,53,white,800)})}

if(t>=30){let e=ease((t-30)/1);orbit(t,.8*e);layer(960,440,mix(1.2,1,e),e,0,()=>{brand(-172,-105,1.9);g.textAlign='center';text('Raum für deinen Betrieb.',0,75,68,white,800);text('Planung. Team. Nachweise. Finanzen.',0,132,25,muted);box(-127,195,254,57,28,R,null);text('mosaos.ch',0,233,25,white,700);g.textAlign='left'})}if(t<30)brand(55,45,.8);text('VISUALISIERUNG · BEISPIELDATEN',1570,1038,12,'#718398');g.globalAlpha=1;};
